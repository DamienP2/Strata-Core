[workspace]
resolver = "2"
members = ["crates/strata-core", "crates/strata-core-server", "crates/strata-decklink", "crates/strata-share"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
semver = { version = "1", features = ["serde"] }
toml = "0.9"
strata-core = { path = "crates/strata-core" }
strata-decklink = { path = "crates/strata-decklink" }
strata-share = { path = "crates/strata-share" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
