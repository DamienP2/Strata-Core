[package]
name = "strata-core-server"
description = "Le service strata-core : le cockpit, les comptes, et bientôt le matériel, la santé et les mises à jour."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "strata-core"
path = "src/main.rs"

[lib]
name = "strata_core_server"
path = "src/lib.rs"

[dependencies]
strata-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
semver.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net", "process", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
# Le relais vers les applis (HTTP/1.1, WebSocket).
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
clap = { version = "4", features = ["derive", "env"] }
argon2 = "0.5"
rpassword = "7"
directories = "6"
arc-swap = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gethostname = "1"
libc = "0.2"
# SSO (OpenID Connect) : appels au fournisseur, vérification du jeton, PKCE.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
ring = "0.17"
sha2 = "0.10"
base64 = "0.22"
# Installer une appli : archive .tar.gz, envoi depuis le navigateur.
tar = "0.4"
flate2 = "1"
http-body-util = "0.1"
# HTTPS : le certificat fait par Strata (rcgen) ou importé (x509-parser), servi par rustls.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
time = "0.3"
x509-parser = "0.18.1"
if-addrs = "0.15.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tower = { version = "0.5", features = ["util"] }
# Matériel : les cartes DeckLink (pont vers le SDK), la bibliothèque NDI (chargée au lancement).
strata-decklink.workspace = true
libloading = "0.8"
jpeg-encoder = "0.6"
strata-share.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
jiff = "1"
rustls-platform-verifier = "0.7"

[dev-dependencies]
