name: Release

# Une étiquette v* (v0.2.0) publie une release GitHub de Strata-Core avec :
#   - strata-core-<version>-linux-x86_64.tar.gz : le serveur strata-core, interface comprise ;
#   - strata-ui-<version>.tgz : le paquet web, que les applis référencent par son adresse ;
#   - release.json : la fiche de la release (version, fichiers, empreintes), lue par le Core ;
#   - strata-install-<version>-linux-x86_64 : l'installateur (binaire statique) ;
#   - install.sh : la commande d'installation (curl … | sudo bash), qui le télécharge et le vérifie ;
#   - SHA256SUMS : les empreintes de chaque fichier.
# Lancée à la main (workflow_dispatch) : avec une version (« 0.1.0 »), elle publie la release v<version>
# sur le commit choisi (l'étiquette est créée par la publication) ; sans version, elle construit les
# mêmes fichiers sans rien publier.
# Tout est construit sur Ubuntu 24.04, la plateforme des serveurs (voir docs/RELEASES.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 0.1.0) ; vide : construire sans publier'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version tirée de l'étiquette (ou donnée à la main)
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then scripts/stamp-version.sh "$INPUT_VERSION"; else scripts/stamp-version.sh; fi

      - name: Version
        run: |
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version : $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/ui/package-lock.json
            web/package-lock.json

      - name: Paquet web
        working-directory: packages/ui
        run: |
          npm ci
          npm run build
          mkdir -p ../../dist
          npm pack --pack-destination ../../dist
          test -f "../../dist/strata-ui-$VERSION.tgz"

      - name: Interface du Core
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: MXL (libmxl.so, embarquée dans l'archive du Core)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-dev ninja-build
          git clone -q https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          git clone -q https://github.com/dmf-mxl/mxl.git /tmp/mxl
          git -C /tmp/mxl checkout -q ce5ac2bffa5d
          cd /tmp/mxl
          # x86-64 de base : MXL choisirait sinon x86-64-v3 (AVX2), qui plante sur un processeur
          # sans AVX2 (machine virtuelle QEMU par exemple).
          VCPKG_ROOT=/tmp/vcpkg cmake --preset Linux-Clang-Release -DMXL_TARGET_ARCH=x86-64 -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_UTILS=OFF -DBUILD_DOCS=OFF -B build
          cmake --build build -j"$(nproc)"
          ls -l build/lib/libmxl.so*
          # Aucune instruction AVX dans la bibliothèque livrée.
          if objdump -d --no-show-raw-insn build/lib/libmxl.so | grep -qE '%[yz]mm'; then echo "libmxl uses AVX" >&2; exit 1; fi

      - name: MTL et DPDK (ST 2110, embarqués dans l'archive du Core sous lib/mtl)
        run: |
          sudo apt-get install -y -q meson ninja-build python3-pyelftools libnuma-dev libjson-c-dev libpcap-dev libssl-dev libxdp-dev libbpf-dev systemtap-sdt-dev pkg-config
          sudo scripts/build-mtl.sh /tmp/mtl-work /tmp/mtl-out
          ls /tmp/mtl-out/lib/mtl
          # Pas de recherche d'AVX ici, contrairement à libmxl : DPDK (-Dplatform=generic, soit
          # -march=corei7) et MTL (-msse4.2) visent un x86-64 sans AVX, mais livrent exprès des
          # chemins AVX2 / AVX-512 choisis à l'exécution selon le processeur (pilotes ice/iavf,
          # conversions de MTL) : un grep de %ymm / %zmm les refuserait à tort.

      - name: Serveur
        # Le pont DeckLink (C++) est exigé dans une release : sans lui, pas de cartes SDI.
        env:
          STRATA_DECKLINK_REQUIRED: '1'
          STRATA_MTL_REQUIRED: '1'
        run: cargo build --release --locked -p strata-core-server

      - name: Archive du serveur
        run: |
          NAME="strata-core-$VERSION-linux-x86_64"
          mkdir -p "build/$NAME"
          cp target/release/strata-core "build/$NAME/"
          mkdir -p "build/$NAME/lib"
          cp -P /tmp/mxl/build/lib/libmxl.so* "build/$NAME/lib/"
          cp /tmp/mxl/LICENSE.txt "build/$NAME/lib/LICENSE-MXL.txt"
          cp -a /tmp/mtl-out/lib/mtl "build/$NAME/lib/mtl"
          cp README.md "build/$NAME/"
          cp packages/ui/src/styles/fonts/OFL.txt "build/$NAME/OFL-Inter.txt"
          "build/$NAME/strata-core" --version
          tar -C build -czf "dist/$NAME.tar.gz" "$NAME"

      - name: Installateur (binaire statique)
        run: |
          sudo apt-get install -y -q musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p strata-install
          cp target/x86_64-unknown-linux-musl/release/strata-install "dist/strata-install-$VERSION-linux-x86_64"
          "dist/strata-install-$VERSION-linux-x86_64" --version
          cp scripts/install.sh dist/install.sh

      - name: Fiche et empreintes
        run: node scripts/release-manifest.mjs dist "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: strata-core-${{ env.VERSION }}
          path: dist/*

      - name: Publication
        if: github.ref_type == 'tag' || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"; [ "$GITHUB_REF_TYPE" = tag ] && TAG="$GITHUB_REF_NAME"
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Strata Core $VERSION" \
            --generate-notes $PRE
