name: CI

# À chaque envoi et chaque pull request : le paquet web se compile et ses types sont justes.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: '@strata/ui'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Le paquet se prépare
        run: npm pack --dry-run
