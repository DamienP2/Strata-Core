name: CI

# À chaque envoi et chaque pull request : le paquet web, l'interface du Core et le serveur Rust se
# construisent ; les tests et clippy passent.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: '@strata/ui et interface du Core'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/ui/package-lock.json
            web/package-lock.json
      - name: '@strata/ui'
        working-directory: packages/ui
        run: |
          npm ci
          npm run build
          npm pack --dry-run
      - name: Interface du Core
        working-directory: web
        run: |
          npm ci
          npm run build

  rust:
    name: Serveur Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: libclang (les bindings MXL)
        run: sudo apt-get install -y -q libclang-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
