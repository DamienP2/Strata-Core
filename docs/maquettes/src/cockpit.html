<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cockpit Strata Core</title>
<style>
/*CSS*/
</style>
<style>
/* ===== Maquette : éléments nouveaux du Core, jetons uniquement ===== */
.mk-sec { font-size: var(--fs-11); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin: 6px 0 -6px; }
/* Tuiles d'applis (cockpit A) */
.mk-app-head { height: 118px; display: grid; place-items: center; border-radius: 13px 13px 0 0; border-bottom: 1px solid var(--line); background: radial-gradient(ellipse at 30% 0%, var(--accent-soft), transparent 70%), var(--panel-2); }
.mk-ico { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-2); flex: none; }
.mk-ico.sm { width: 36px; height: 36px; border-radius: 10px; }
.mk-ico.xs { width: 28px; height: 28px; border-radius: 8px; }
.mk-ico.off { background: var(--panel-3); color: var(--text-3); }
.mk-addr { font: 11.5px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; font-size: 12px; color: var(--text-2); }
.project-card.mk-click { cursor: pointer; }
/* Tuiles compactes (B) */
.mk-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.mk-tile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; }
.mk-tile:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35); }
.mk-tile strong { display: block; font-size: 14px; }
.mk-tile small { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; }
/* Lanceur (C) */
.mk-launch-page { height: 100%; overflow: auto; background: radial-gradient(ellipse at top, #141725 0%, #0b0c12 60%); display: flex; flex-direction: column; align-items: center; padding: 9vh 24px 60px; gap: 34px; }
:root[data-theme='light'] .mk-launch-page { background: var(--bg); }
.mk-launch-head { text-align: center; }
.mk-launch-head h1 { margin: 0; font-size: 22px; font-weight: 800; }
.mk-launch-head p { margin: 4px 0 0; }
.mk-launch { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 900px; }
.mk-big { width: 176px; height: 176px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; }
.mk-big:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35); }
.mk-big strong { font-size: 15px; }
.mk-alert-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--warn); font-size: 12.5px; cursor: pointer; }
/* Lanceur dans la barre (C) et menu de la marque (A) */
.mk-anchor { position: relative; flex: none; }
.mk-brand-btn { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 8px 4px 4px; margin-left: -4px; border-radius: 8px; cursor: pointer; color: var(--text-3); }
.mk-brand-btn:hover, .mk-brand-btn.on { background: var(--panel-2); }
.menu.mk-switch { min-width: 240px; }
.menu.mk-launcher { width: 330px; }
.mk-l-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px; font-size: 12px; color: var(--text-3); }
.mk-l-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.mk-l-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border-radius: 10px; border: 0; background: none; color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer; }
.mk-l-item:hover, .mk-l-item.on { background: var(--accent-soft); }
.mk-sq { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 0; background: none; color: var(--text-2); cursor: pointer; }
.mk-sq:hover, .mk-sq.on { background: var(--panel-3); color: var(--text); }
/* Rail (B) */
.mk-shell { display: flex; height: 100%; }
.mk-shell > .app { flex: 1; min-width: 0; }
.mk-rail { width: 62px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 0 12px; background: var(--panel); border-right: 1px solid var(--line); }
.mk-rail-sep { width: 28px; height: 1px; background: var(--line); margin: 4px 0; }
.mk-rail-btn { position: relative; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; border: 0; background: none; color: var(--text-2); cursor: pointer; }
.mk-rail-btn:hover { background: var(--panel-3); color: var(--text); }
.mk-rail-btn.on { background: var(--accent-soft); color: var(--accent-2); }
.mk-rail-btn.on::before { content: ''; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.mk-rail-logo { width: 42px; height: 34px; display: grid; place-items: center; color: var(--text); margin-bottom: 4px; }
:root[data-theme='light'] .mk-rail-logo { color: var(--text); }
/* Mesures */
.mk-meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .mk-meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mk-meter { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.mk-meter-h { display: flex; align-items: baseline; gap: 8px; color: var(--text-2); font-size: 12px; }
.mk-meter-h b { margin-left: auto; color: var(--text); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mk-meter .muted { font-size: 11.5px; }
.mk-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .mk-cols { grid-template-columns: 1fr; } }
.mk-lines { display: flex; flex-direction: column; }
.mk-line { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 12.5px; }
.mk-line + .mk-line { border-top: 1px solid var(--line); }
.mk-line .grow { flex: 1; min-width: 0; }
.mk-line .muted { font-size: 12px; }
.badge.ok { background: color-mix(in srgb, var(--pvw) 15%, transparent); color: var(--pvw); }
.badge.acc { background: var(--accent-soft); color: var(--accent-2); }
.hw-dot.ok { background: var(--pvw); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pvw) 18%, transparent); }
.hw-dot.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }
.mk-port-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mk-port-name strong { min-width: 52px; }
.mk-port-name .dd-btn { width: 110px; height: var(--h-control-dense); }
.hw-port .mono { font: 12px var(--mono); }
.mk-uses { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.user-table td.r { text-align: right; white-space: nowrap; }
.user-table .mono { font-family: var(--mono); font-size: 12px; }
.mk-apphead { display: flex; align-items: center; gap: 14px; }
.mk-apphead h1 { margin: 0; font-size: 22px; font-weight: 800; }
.mk-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.mk-libcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.mk-libcard.off { opacity: 0.85; }
.mk-libcard-h { display: flex; align-items: center; gap: 12px; }
.mk-libcard-h div { flex: 1; min-width: 0; }
.mk-libcard-h strong { display: block; font-size: 14.5px; }
.mk-libcard-f { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.mk-libcard .check { font-size: 12.5px; }
.mk-sso-row { display: flex; align-items: center; gap: 10px; }
.mk-tabbar { margin: -4px 0 0; }
.mk-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* Corps d'une appli (fictif) : images de la maquette de LiveCut */
.sc-pic.p1 { background: radial-gradient(ellipse at 30% 40%, #3a4a7a 0%, transparent 55%), radial-gradient(ellipse at 75% 70%, #6b3a52 0%, transparent 50%), linear-gradient(160deg, #1a1f33, #0a0b12); }
.sc-pic.p2 { background: radial-gradient(ellipse at 60% 30%, #2f6b62 0%, transparent 55%), radial-gradient(ellipse at 20% 80%, #22304f 0%, transparent 55%), linear-gradient(200deg, #12202a, #07080c); }
.sc-pic.p3 { background: radial-gradient(ellipse at 50% 55%, #7a5a2a 0%, transparent 50%), linear-gradient(180deg, #23283b, #0b0c12); }
.sc-pic.p4 { background: radial-gradient(ellipse at 35% 35%, #4b3a7a 0%, transparent 55%), radial-gradient(ellipse at 80% 60%, #2a5a7a 0%, transparent 50%), linear-gradient(140deg, #171a2b, #08090e); }
.mk-appbody .project-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
/* Commandes de la maquette */
.mock-note { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9000; display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: #000; color: #fff; font: 11px Inter, system-ui, sans-serif; opacity: 0.9; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); white-space: nowrap; }
.mock-note button { border: 1px solid #444; background: #111; color: #ddd; border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
.mock-note button.on { background: #fff; color: #000; }
.mock-note i { width: 1px; height: 18px; background: #444; margin: 0 4px; }
.mock-note span { color: #aaa; padding: 0 4px; }
.mock-note { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 760px) { .mock-note { flex-wrap: wrap; justify-content: center; white-space: normal; width: calc(100% - 32px); } .topbar { overflow-x: auto; } }
</style>
<style>
/* ===== Maquette C : navigateur simulé, plusieurs serveurs ===== */
:root { --ch-bg: #0d0e12; --ch-tab: #191b22; --ch-on: #23262f; --ch-text: #c9ccd6; --ch-dim: #858a9c; }
:root[data-theme='light'] { --ch-bg: #d9dce3; --ch-tab: #e6e8ee; --ch-on: #f7f8fa; --ch-text: #2a2e3a; --ch-dim: #5d6273; }
html, body { background: var(--bg); }
#root { display: flex; flex-direction: column; height: 100%; }
.mk-browser { flex: none; background: var(--ch-bg); color: var(--ch-text); font: 12px Inter, system-ui, sans-serif; }
.mk-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0; overflow-x: auto; }
.mk-btab { display: flex; align-items: center; gap: 8px; height: 32px; min-width: 120px; max-width: 230px; padding: 0 8px 0 12px; border-radius: 9px 9px 0 0; background: var(--ch-tab); color: var(--ch-dim); cursor: pointer; flex: none; }
.mk-btab:hover { color: var(--ch-text); }
.mk-btab.on { background: var(--ch-on); color: var(--ch-text); }
.mk-btab-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-fav { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-2); flex: none; }
.mk-x { display: grid; place-items: center; width: 18px; height: 18px; border: 0; border-radius: 4px; background: none; color: inherit; cursor: pointer; padding: 0; }
.mk-x:hover { background: rgba(127, 127, 127, 0.25); }
.mk-url { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; background: var(--ch-on); border-bottom: 1px solid var(--line); color: var(--ch-dim); }
.mk-url b { color: var(--ch-text); font-weight: 500; }
.mk-page { flex: 1; min-height: 0; }
.mk-page > .app { height: 100%; }
/* Tuiles par appli */
.mk-big { height: auto; min-height: 176px; padding: 18px 12px 14px; gap: 10px; }
.mk-big.dim { opacity: 0.5; cursor: default; }
.mk-big.dim:hover { transform: none; box-shadow: none; border-color: var(--line); }
.mk-big .muted { font-size: 12px; }
.mk-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.mk-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
.mk-pill:hover { border-color: var(--accent); background: var(--accent-soft); }
.mk-pill:disabled { opacity: 0.5; cursor: default; border-color: var(--line); background: none; }
.mk-pill .nav-dot { width: 6px; height: 6px; }
/* Serveurs (administrateurs) */
.mk-servers { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.mk-srv { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text-2); font: inherit; font-size: 12.5px; cursor: pointer; }
.mk-srv:hover { border-color: var(--line-2); color: var(--text); }
.mk-srv b { color: var(--text); font-weight: 600; }
.mk-srv .warn-t { color: var(--warn); }
.mk-srv .bad-t { color: var(--live); }
.nav-dot.bad { background: var(--live); box-shadow: 0 0 0 3px var(--live-soft); }
/* Lanceur */
.menu.mk-launcher { width: 360px; padding: 6px; }
.mk-lrow { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 8px; border-radius: 8px; }
.mk-lrow.click { cursor: pointer; }
.mk-lrow.click:hover, .mk-lrow.on { background: var(--accent-soft); }
.mk-lrow strong { flex: 1; font-weight: 600; }
.mk-lrow .mk-pill { height: 24px; font-size: 11.5px; }
.mk-srv-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--panel-3); color: var(--text-2); font-size: 12px; flex: none; }
.mk-code { font: 700 26px/1 var(--mono); letter-spacing: 0.12em; color: var(--text); padding: 14px; border-radius: 10px; background: var(--panel-2); border: 1px dashed var(--line-2); text-align: center; }
.mk-modal-body { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
<div id="root"></div>

<div class="mock-note" id="mock">
  <span>Maquette C</span>
  <button data-role="admin">Administrateur</button><button data-role="user">Utilisateur</button>
  <i></i>
  <button data-mtheme>Clair / Sombre</button>
  <button data-reset>Recommencer</button>
</div>

<script>
const ICONS = /*ICONS*/{};
const F = '/*F*/';
const ic = (n, s = 14) => `<svg class="lucide" xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

// ------------------------------------------------------------------ données
const DOMAIN = 'regie.exemple.fr';
const SERVERS = [
  { id: 'strata01', name: 'Régie A', master: true, up: true, alerts: 1, cpu: 34, mem: 21, since: '12 j' },
  { id: 'strata02', name: 'Régie B', master: false, up: true, alerts: 0, cpu: 18, mem: 12, since: '3 j' },
  { id: 'strata03', name: 'Studio', master: false, up: false, alerts: 0, cpu: 0, mem: 0, since: '' },
];
const MASTER = SERVERS[0];
const APPS = {
  livecut: { name: 'LiveCut', icon: 'scissors', tabs: [['radio-tower', 'Enregistreurs'], ['scissors', 'Extraction'], ['clapperboard', 'Extraits'], ['settings', 'Réglages']] },
  graphics: { name: 'Graphics', icon: 'layers', tabs: [['layers', 'Projets'], ['package', 'Ressources'], ['activity', 'Données'], ['radio-tower', 'Diffusion'], ['settings', 'Réglages']] },
  multiview: { name: 'Multiview', icon: 'layout-grid', tabs: [['layout-grid', 'Mosaïques'], ['radio-tower', 'Sources'], ['monitor', 'Sorties'], ['settings', 'Réglages']] },
  network: { name: 'Network', icon: 'network', tabs: [['network', 'Réseau'], ['settings', 'Réglages']] },
  media: { name: 'Media', icon: 'film', ver: '0.1.0' },
  call: { name: 'Call', icon: 'phone', ver: '0.1.0' },
};
// Une appli installée sur un serveur.
const INST = [
  { app: 'livecut', sv: 'strata01', ver: '0.3.0', next: '0.3.1', state: 'active', user: true, cpu: 22, mem: '9,8 Go' },
  { app: 'graphics', sv: 'strata01', ver: '0.8.0', state: 'active', user: false, cpu: 9, mem: '3,1 Go' },
  { app: 'livecut', sv: 'strata02', ver: '0.3.0', next: '0.3.1', state: 'active', user: true, cpu: 14, mem: '6,2 Go' },
  { app: 'network', sv: 'strata02', ver: '0.4.1', next: '0.5.0', needs: '1.1', state: 'inactive' },
  { app: 'multiview', sv: 'strata03', ver: '0.5.2', state: 'active', user: true, cpu: 6, mem: '2,4 Go' },
];
const ME = { admin: { name: 'Damien', init: 'D', role: 'Administrateur des serveurs' }, user: { name: 'Claire Martin', init: 'C', role: 'Utilisateur' } };
const sv = (id) => SERVERS.find((s) => s.id === id);
const host = (s) => `${s.id}.${DOMAIN}`;
const instUrl = (i) => `${i.app}.${i.sv}.${DOMAIN}`;
const instKey = (i) => `${i.app}@${i.sv}`;
const inst = (key) => INST.find((i) => instKey(i) === key);

// ------------------------------------------------------------------ état : les onglets du navigateur
const fresh = () => ({ tabs: [{ id: 'cockpit', kind: 'cockpit', view: 'home', page: null }], active: 'cockpit', menu: null, modal: null });
const S = Object.assign({ role: 'admin' }, fresh());
const isAdmin = () => S.role === 'admin';
const tab = () => S.tabs.find((t) => t.id === S.active);
let CTX = MASTER; // le serveur dont on montre les réglages

// Applis du cockpit, regroupées par appli : les instances actives où l'utilisateur a des droits.
function byApp() {
  const out = [];
  for (const i of INST.filter((i) => i.state === 'active' && (isAdmin() || i.user))) {
    let g = out.find((g) => g.app === i.app);
    if (!g) out.push((g = { app: i.app, list: [] }));
    g.list.push(i);
  }
  return out;
}

// ------------------------------------------------------------------ ouvrir, fermer
function activate(id) { S.active = id; S.menu = null; }
function openApp(key) {
  const i = inst(key);
  if (!sv(i.sv).up) return;
  const id = 'app:' + key;
  if (!S.tabs.find((t) => t.id === id)) S.tabs.push({ id, kind: 'app', key });
  activate(id);
}
function openSettings(id, page) {
  if (id === MASTER.id) { const c = S.tabs[0]; c.view = 'settings'; c.page = page || c.page || 'overview'; return activate('cockpit'); }
  const tid = 'set:' + id;
  let t = S.tabs.find((t) => t.id === tid);
  if (!t) S.tabs.push((t = { id: tid, kind: 'settings', sv: id, page: 'overview' }));
  if (page) t.page = page;
  activate(tid);
}
function tabTitle(t) {
  if (t.kind === 'cockpit') return t.view === 'settings' ? `Réglages · ${MASTER.name}` : 'Strata';
  if (t.kind === 'settings') return `Réglages · ${sv(t.sv).name}`;
  const i = inst(t.key);
  return `${APPS[i.app].name} · ${sv(i.sv).name}`;
}
function tabUrl(t) {
  if (t.kind === 'cockpit') return t.view === 'settings' ? [host(MASTER), '/reglages'] : [host(MASTER), '/'];
  if (t.kind === 'settings') return [host(sv(t.sv)), '/reglages'];
  return [instUrl(inst(t.key)), '/'];
}
const tabIcon = (t) => (t.kind === 'app' ? APPS[inst(t.key).app].icon : t.kind === 'settings' || t.view === 'settings' ? 'settings' : 'grid-3x3');

// ------------------------------------------------------------------ pièces communes
function brand(module) {
  return `<div class="brand" aria-label="Strata ${module}, Le Figaro AudioVisuel"><span class="brand-lockup"><svg class="brand-f-lead" viewBox="93.8 -0.2 52.3 52.95" width="23.7" height="24" aria-hidden="true"><path fill="currentColor" d="${F}"/></svg><span class="brand-name">Strata</span><span class="brand-module">${module}</span></span></div>`;
}
const head = (title, sub, actions = '') => `<div class="settings-head"><div><h1>${title}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}</div><div class="spacer"></div>${actions}</div>`;
const card = (icon, title, body, actions = '') => `<section class="set-card"><header>${ic(icon, 16)}<h2>${title}</h2>${actions ? `<div class="spacer"></div>${actions}` : ''}</header><div class="set-body">${body}</div></section>`;
const field = (label, input) => `<label class="set-field"><span class="set-label">${label}</span>${input}</label>`;
const dd = (label) => `<button class="dd-btn"><span class="dd-label">${label}</span>${ic('chevron-down', 12)}</button>`;
const sw = (label, on = true) => `<label class="check"><input type="checkbox" ${on ? 'checked' : ''} /> ${label}</label>`;
const seg = (opts, on = 0) => `<div class="segmented">${opts.map((o, i) => `<button class="${i === on ? 'on' : ''}">${o}</button>`).join('')}</div>`;
const bar = (pct, tone = 'ok') => `<span class="perf-bar tone-${tone}"><span class="perf-bar-fill" style="transform:translateX(${pct - 100}%)"></span></span>`;
const meter = (label, val, pct, sub, tone = 'ok') => `<div class="mk-meter"><div class="mk-meter-h"><span>${label}</span><b>${val}</b></div>${bar(pct, tone)}<span class="muted">${sub}</span></div>`;
const lines = (rows) => `<div class="mk-lines">${rows.join('')}</div>`;
const line = (dot, label, right) => `<div class="mk-line"><span class="nav-dot ${dot}"></span><span class="grow">${label}</span>${right}</div>`;

function right({ gear }) {
  const me = ME[S.role];
  return `<div class="spacer"></div>
  <span class="ux1-pill" title="Connecté"><span class="ux1-dot"></span>Connecté</span>

  ${isAdmin() && gear ? `<button class="learn-help ${gear === 'on' ? 'on' : ''}" title="Réglages du serveur" data-settings="${gear === 'on' ? '' : gear}">${ic('settings', 17)}</button>` : ''}
  <div class="ux1-user">
    <button class="ux1-user-btn named ${S.menu === 'user' ? 'on' : ''}" data-menu="user"><span class="avatar">${me.init}</span><span class="user-name">${me.name}</span>${ic('chevron-down', 13)}</button>
    ${S.menu === 'user' ? `<div class="menu ux1-umenu">
      <div class="ux1-who"><span class="avatar">${me.init}</span><div><b>${me.name}</b><small>${me.role}</small></div></div>
      <div class="menu-sep"></div>

      <button class="ux1-mi">${ic('keyboard')} Raccourcis clavier <span class="ux1-cap">?</span></button>

// Bouton d'une instance : le nom du serveur (Régie A…), l'hôte et ses alertes en plus pour les administrateurs.
function instPill(i) {
  const s = sv(i.sv);
  if (!s.up) return `<button class="mk-pill" disabled title="${isAdmin() ? `${s.id} injoignable` : 'Indisponible'}">${isAdmin() ? `<span class="nav-dot bad"></span>${s.name}` : `${s.name} · indisponible`}</button>`;
  const dot = isAdmin() ? `<span class="nav-dot ${s.alerts ? 'warn' : 'ok'}"></span>` : '';
  return `<button class="mk-pill" data-inst="${instKey(i)}" title="${isAdmin() ? `${s.id}${s.alerts ? ` · ${s.alerts} alerte` : ''}` : ''}">${dot}${s.name}</button>`;
}

// Le lanceur ⊞, le même dans tous les onglets.
function launcher(curKey) {
  return `<div class="menu mk-launcher">
    <div class="mk-l-head"><span>Applis</span><button class="btn small ghost" data-home>${ic('grid-3x3', 13)} Cockpit</button></div>
    ${byApp().map((g) => {
      const A = APPS[g.app];
      const one = g.list.length === 1 && sv(g.list[0].sv).up;
      return `<div class="mk-lrow ${one ? 'click' : ''} ${g.list.some((i) => instKey(i) === curKey) ? 'on' : ''}" ${one ? `data-inst="${instKey(g.list[0])}"` : ''}><span class="mk-ico xs">${ic(A.icon, 15)}</span><strong>${A.name}</strong>
        ${one ? (isAdmin() ? `<span class="muted">${sv(g.list[0].sv).name}</span>` : '') : g.list.map(instPill).join('')}</div>`;
    }).join('')}
  </div>`;
}
const launchBtn = (curKey) => `<div class="mk-anchor"><button class="mk-sq ${S.menu === 'launch' ? 'on' : ''}" data-menu="launch" title="Applis">${ic('grid-3x3', 17)}</button>${S.menu === 'launch' ? launcher(curKey) : ''}</div>`;

// ------------------------------------------------------------------ le cockpit
function cockpit() {
  const groups = byApp();
  const tiles = groups.map((g) => {
    const A = APPS[g.app];
    const up = g.list.filter((i) => sv(i.sv).up);
    if (!up.length) return `<div class="mk-big dim"><span class="mk-ico off">${ic(A.icon, 28)}</span><strong>${A.name}</strong><span class="muted">Indisponible</span></div>`;
    if (g.list.length === 1) {
      const s = sv(g.list[0].sv);
      return `<div class="mk-big" data-inst="${instKey(g.list[0])}"><span class="mk-ico">${ic(A.icon, 28)}</span><strong>${A.name}</strong>${isAdmin() ? `<span class="muted">${s.name}</span>` : ''}</div>`;
    }
    return `<div class="mk-big" style="cursor:default"><span class="mk-ico">${ic(A.icon, 28)}</span><strong>${A.name}</strong><div class="mk-pills">${g.list.map(instPill).join('')}</div></div>`;
  }).join('');
  const servers = isAdmin() ? `<div class="mk-servers">${SERVERS.map((s) => `<button class="mk-srv" data-settings="${s.id}" title="Réglages de ${s.name}"><span class="nav-dot ${!s.up ? 'bad' : s.alerts ? 'warn' : 'ok'}"></span><b>${s.name}</b><span>${s.id}</span>${!s.up ? '<span class="bad-t">injoignable</span>' : s.alerts ? `<span class="warn-t">${s.alerts} alerte</span>` : ''}</button>`).join('')}</div>` : '';
  return `<section class="mk-launch-page"><div class="mk-launch-head"><h1>Applis</h1></div><div class="mk-launch">${tiles}</div>${servers}</section>`;
}

  const g = [['Ce serveur', [['overview', 'layout-dashboard', 'Vue d’ensemble'], ['general', 'globe', 'Nom et adresses'], ['https', 'lock', 'HTTPS'], ['updates', 'cloud-download', 'Mises à jour', here().filter((i) => i.next).length || null], ['cockpit', 'grid-3x3', CTX.master ? 'Serveurs' : 'Cockpit', CTX.master ? SERVERS.length : null]]],
    ['Applis', [...here().map((i) => ['app:' + i.app, APPS[i.app].icon, APPS[i.app].name, null, i.state === 'active' ? 'ok' : 'off']), ['library', 'plus', 'Ajouter une appli']]]];
  if (CTX.master) g.push(['Personnes', [['users', 'users', 'Utilisateurs', 5], ['groups', 'users-round', 'Groupes', 4], ['sso', 'key-round', 'Annuaire']]]);
  g.push(['Matériel', [['sdi', 'monitor', 'Cartes SDI'], ['ndi', 'radio-tower', 'NDI'], ['st2110', 'waves', 'ST 2110'], ['network', 'ethernet-port', 'Réseau'], ['clock', 'clock', 'Horloge']]],
    ['Surveillance', [['logs', 'scroll-text', 'Journaux'], ['alerts', 'bell', 'Alertes', CTX.alerts || null], ['snmp', 'radio', 'SNMP']]]);
  return g;
}
function settingsView(t) {
  const cur = t.page || 'overview';
  const navHtml = nav().map(([title, items]) => `<div class="lib-nav-section"><span class="grow">${title}</span></div>` + items.map(([id, icon, label, count, dot]) =>
    `<div class="lib-nav-item ${cur === id ? 'on' : ''}" data-page="${id}">${ic(icon, 15)}<span class="grow">${label}</span>${count ? `<span class="count">${count}</span>` : ''}${dot ? `<span class="nav-dot ${dot === 'ok' ? 'ok' : ''}"></span>` : ''}</div>`).join('')).join('');
  const body = cur.startsWith('app:') ? appPage(cur.slice(4)) : (PAGES[cur] || PAGES.overview)();
  return `<section class="projects-page"><aside class="lib-nav">${navHtml}</aside><main class="library"><div class="library-inner">${body}</div></main></section>`;
}

  return `<div class="mk-apphead"><span class="mk-ico ${active ? '' : 'off'}">${ic(APPS[a].icon, 26)}</span><div><h1>${APPS[a].name}</h1><p class="muted" style="margin:4px 0 0">${active ? `https://${instUrl(i)}` : 'Installée · inactive'}</p></div><div class="spacer"></div>${active ? `<button class="btn primary" data-inst="${instKey(i)}">${ic('arrow-up-right')} Ouvrir</button>` : ''}</div>` +
    card('power', 'État', `<div class="mk-sub">${sw('Active', active)}${active ? '<span class="badge ok">En marche</span>' : '<span class="badge">Arrêtée</span>'}<div class="spacer"></div>${active ? `<button class="btn">${ic('rotate-ccw')} Redémarrer</button>` : ''}</div>`) +
    card('cloud-download', 'Version', `<div class="mk-sub"><span class="update-version">${i.ver}</span><div class="spacer"></div>${i.next ? (i.needs ? `<span class="badge warn">${i.next} demande le Core ${i.needs}</span>` : `<span class="mono">${i.next}</span><button class="btn primary">${ic('cloud-download')} Mettre à jour</button>`) : '<span class="badge ok">À jour</span>'}</div>`) +
    (active ? card('activity', 'Ressources', `<div class="set-grid two"><div class="mk-meter"><div class="mk-meter-h"><span>Processeur</span><b>${i.cpu} %</b></div>${bar(i.cpu)}</div><div class="mk-meter"><div class="mk-meter-h"><span>Mémoire</span><b>${i.mem}</b></div>${bar(15)}</div></div>`) : '') +
    `<div><button class="btn danger">${ic('trash-2')} Désinstaller</button></div>`;
}

// ------------------------------------------------------------------ une appli ouverte (contenu fictif)
function appView(t) {
  const i = inst(t.key), A = APPS[i.app];
  const pics = ['p1', 'p2', 'p4', 'p3'];
  const top = `<nav class="topbar">${launchBtn(t.key)}${brand(A.name)}<div class="tabs home-tabs">${A.tabs.map(([icon, l], n) => `<button class="${n === 0 ? 'on' : ''}">${ic(icon)} <span>${l}</span></button>`).join('')}</div>${right({ gear: i.sv })}</nav>`;
  const body = `<section class="library mk-appbody"><div class="library-inner wide">${head(A.tabs[0][1], sv(i.sv).name, `<button class="btn primary">${ic('plus')} Nouveau</button>`)}
    <div class="project-grid">${pics.map((p, n) => `<article class="project-card"><div class="sc-thumb"><div class="sc-pic ${p}"></div></div><div class="project-body"><strong>${['Plateau 1', 'Duplex SRT', 'Régie 2', 'Antenne'][n]}</strong><span class="muted">${['SDI 1', 'SRT', 'ST 2110', 'UDP'][n]}</span></div><div class="mk-foot"><span class="nav-dot ok"></span>En marche</div></article>`).join('')}</div></div></section>`;
  return `<div class="app">${top}<div class="content">${body}</div></div>`;
}

// ------------------------------------------------------------------ rendu
function page(t) {
  if (t.kind === 'app') return appView(t);
  CTX = t.kind === 'settings' ? sv(t.sv) : MASTER;
  if (t.kind === 'cockpit' && t.view === 'home') return `<div class="app"><nav class="topbar">${launchBtn()}${brand('Core')}${right({ gear: MASTER.id })}</nav><div class="content">${cockpit()}</div></div>`;
  return `<div class="app"><nav class="topbar">${launchBtn()}${brand('Réglages')}<span class="mk-srv-badge">${ic('server', 12)} ${CTX.name} · ${CTX.id}</span>${right({ gear: 'on' })}</nav><div class="content">${settingsView(t)}</div></div>`;
}
function modal() {
  if (S.modal !== 'invite') return '';
  return `<div class="modal-back" data-close-modal><div class="modal"><header><h2>Ajouter un serveur</h2><button class="icon-btn ghost" data-close-modal title="Fermer">${ic('x', 16)}</button></header>
    <div class="mk-modal-body">${field('Adresse du maître', `<input value="${host(MASTER)}" readonly />`)}<div class="mk-code">K7Q-4XM-92P</div><span class="muted" style="text-align:center">Valable 10 min</span></div>
    <footer><button class="btn">${ic('rotate-ccw')} Nouveau code</button><button class="btn primary" data-close-modal>Fermer</button></footer></div></div>`;
}
function render() {
  const t = tab();
  const [h, path] = tabUrl(t);
  document.getElementById('root').innerHTML = `<div class="mk-browser"><div class="mk-tabs">${S.tabs.map((x) => `<div class="mk-btab ${x.id === S.active ? 'on' : ''}" data-tab-id="${x.id}"><span class="mk-fav">${ic(tabIcon(x), 11)}</span><span class="mk-btab-t">${tabTitle(x)}</span>${x.id === 'cockpit' ? '' : `<button class="mk-x" data-close-tab="${x.id}" title="Fermer l’onglet">${ic('x', 12)}</button>`}</div>`).join('')}</div>
    <div class="mk-url">${ic('lock', 12)}<span><b>${h}</b>${path === '/' ? '' : path}</span></div></div>
    <div class="mk-page">${page(t)}</div>${modal()}`;
  document.querySelectorAll('#mock [data-role]').forEach((b) => b.classList.toggle('on', b.dataset.role === S.role));
  try { localStorage.setItem('mkc.role', S.role); } catch { /* */ }
}
const theme = () => (document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
function setTheme(t) { if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; }

document.addEventListener('click', (e) => {
  const q = (sel) => e.target.closest(sel);
  let el;
  if ((el = q('[data-role]'))) { Object.assign(S, { role: el.dataset.role }, fresh()); return render(); }
  if (q('[data-reset]')) { Object.assign(S, fresh()); return render(); }
  if (q('[data-mtheme]')) { setTheme(theme() === 'light' ? 'dark' : 'light'); return render(); }
  if ((el = q('[data-theme-set]'))) { setTheme(el.dataset.themeSet); return render(); }
  if ((el = q('[data-close-tab]'))) { const id = el.dataset.closeTab; const n = S.tabs.findIndex((t) => t.id === id); S.tabs.splice(n, 1); if (S.active === id) S.active = S.tabs[Math.max(0, n - 1)].id; return render(); }
  if ((el = q('[data-close-modal]')) && (el.dataset.closeModal !== undefined) && (e.target === el || q('button[data-close-modal]'))) { S.modal = null; return render(); }
  if ((el = q('[data-modal]'))) { S.modal = el.dataset.modal; return render(); }
  if ((el = q('[data-menu]'))) { S.menu = S.menu === el.dataset.menu ? null : el.dataset.menu; return render(); }
  if ((el = q('[data-inst]'))) { openApp(el.dataset.inst); return render(); }
  if (q('[data-home]')) { S.tabs[0].view = 'home'; activate('cockpit'); return render(); }
  if ((el = q('[data-settings]'))) { if (el.dataset.settings) openSettings(el.dataset.settings); return render(); }
  if ((el = q('[data-tab-id]'))) { activate(el.dataset.tabId); return render(); }
  if ((el = q('[data-page]'))) { tab().page = el.dataset.page; return render(); }
  if ((el = q('.segmented button'))) { el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el)); return; }
  if (S.menu && !q('.menu')) { S.menu = null; render(); }
});
try { const r = localStorage.getItem('mkc.role'); if (r === 'admin' || r === 'user') S.role = r; } catch { /* */ }
if (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: light)').matches) setTheme('light');
if (document.documentElement.dataset.theme === 'dark') delete document.documentElement.dataset.theme;
render();
</script>
</body>
</html>
