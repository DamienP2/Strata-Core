.rl-table tr.rl-part td { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); font-weight: 600; background: var(--panel-2, rgba(255,255,255,0.02)); padding-top: 14px; }

/* Programmation: the timeline on the left (each source's picture at the head of its line), the slots on the right. */
.sc-plan { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); background: radial-gradient(ellipse at top, #141725 0%, #0b0c12 60%); }
.sc-plan-main { min-width: 0; min-height: 0; overflow: auto; padding: 24px 24px 60px; display: flex; flex-direction: column; gap: 16px; }
.sc-plan-main .sc-cal { margin-bottom: 0; }
.sc-plan .sc-cal-row.sc-cal-axis { min-height: 28px; }
.sc-plan .sc-cal-row { grid-template-columns: 300px 1fr; min-height: 104px; }
.sc-cal-src { display: flex; align-items: center; gap: 12px; padding: 10px 12px; font-weight: 400; white-space: normal; }
.sc-cal-pic { position: relative; flex: none; width: 140px; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #05060a; }
.sc-cal-pic img, .sc-cal-pic .sc-pic { width: 100%; height: 100%; object-fit: cover; display: block; }
.sc-cal-pic .sc-onpic { height: 17px; font-size: 9.5px; padding: 0 6px; top: 5px; left: 5px; }
.sc-cal-pic .sc-onpic .sc-rec { width: 6px; height: 6px; }
.sc-cal-pic-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); }
.sc-cal-info-name { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; font-size: 13px; }
.sc-cal-info-name b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-slot-bar { align-self: stretch; border-radius: 2px; background: var(--accent); }
.sc-slot-txt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sc-slot-hm { font: 600 12px var(--mono); }
.sc-slot-txt b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-slot-txt small { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-slot-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
@media (max-width: 1100px) { .sc-plan { grid-template-columns: 1fr; grid-template-rows: auto; height: 100%; overflow: auto; } .sc-plan-main { overflow: visible; } .sc-plan .sc-cal-row { grid-template-columns: 200px 1fr; } .sc-cal-pic { width: 80px; } }

/* Extraction, Streamer: the sources that can be chosen, by group (the group says the state). */
.sc-grp { display: flex; flex-direction: column; gap: 1px; margin-bottom: 6px; }
.sc-grp-title { display: flex; align-items: center; gap: 6px; padding: 10px 10px 5px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
.sc-grp-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text-4, #5a5f73); }
.sc-grp-dot.rec { background: var(--live); box-shadow: 0 0 0 3px rgba(255, 59, 92, 0.18); }
.sc-grp-dot.ok { background: var(--pvw); }
.sc-grp-dot.warn { background: var(--warn); }
.sc-grp-dot.bad { background: var(--live); }
.sc-grp-dot.plan { background: #a78bfa; }
.sc-grp-pic { width: 36px; aspect-ratio: 16 / 9; border-radius: 4px; flex: none; overflow: hidden; background: repeating-linear-gradient(135deg, #10121a 0 5px, #0c0e15 5px 10px); }
.sc-grp-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sc-grp-n { color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.sc-grp-it { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 8px; }
.sc-grp-empty { padding: 8px 10px; font-size: 12px; color: var(--text-3); }
.sc-grp-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segmented.sc-rec-mode { margin: 0 0 14px; }
.sc-plan-main > * { flex: none; }
.sc-ndi-pick { display: flex; align-items: center; gap: 8px; }
.sc-ndi-pick > .dd-btn, .sc-ndi-pick > .muted { flex: 1; min-width: 0; }

/* Régie: what the marks in the rows are. */
.sc-cal-key { display: inline-flex; align-items: center; gap: 14px; margin-right: 8px; font-size: 12px; color: var(--text-3); }
.sc-cal-key > span { display: inline-flex; align-items: center; gap: 6px; }
.sc-cal-key i { width: 16px; height: 10px; border-radius: 3px; flex: none; }
.sc-cal-key i.rec { background: #000; border: 1px solid var(--live); }
.sc-cal-key i.hole { background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--warn) 45%, transparent) 3px 6px); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.sc-cal-key i.slot { background: var(--accent-soft); border: 1px solid var(--accent); }
@media (max-width: 1100px) { .sc-cal-key { display: none; } }

/* Régie, compact: a line is the source's small picture and name, then one band where the
   programmed recordings are drawn over what was recorded (the programme guide above it). */
.sc-plan-main { padding-top: 16px; gap: 12px; }
.sc-cal-title { font-size: 18px; margin: 0 8px 0 2px; }
.sc-plan .sc-cal-row { grid-template-columns: 340px 1fr; min-height: 54px; }
.sc-cal-src { gap: 10px; padding: 6px 10px; }
.sc-cal-pic { width: 64px; border-radius: 4px; }
.sc-cal-pic .sc-onpic { height: 13px; font-size: 8px; padding: 0 4px; top: 3px; left: 3px; gap: 3px; }
.sc-cal-pic .sc-onpic .sc-rec { width: 5px; height: 5px; }
.sc-cal-rec, .sc-cal-tile, .sc-cal-hole, .sc-cal-row .sc-cal-cont.todo { top: 19px; bottom: 4px; height: auto; }
.sc-cal-sel { top: 19px; bottom: 4px; }
.sc-cal-prog { top: 2px; height: 14px; line-height: 14px; }
/* Past programmed recordings: an outline over the pictures recorded in them. */
.sc-cal-slot.past { background: transparent; border-color: color-mix(in srgb, var(--text-3) 70%, transparent); color: var(--text); filter: none; text-shadow: 0 1px 2px #000; }
/* Régie: REC (all the time) or Stop, compact, at the end of the source's head. */
.sc-cal-src .sc-cal-info-name { flex: 1; }
/* REC | OFF: the state lit; the other half switches. */
.sc-recseg { flex: none; display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); }
.sc-recseg button { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: var(--text-3); font: 700 10.5px Inter, system-ui, sans-serif; letter-spacing: 0.04em; cursor: pointer; }
.sc-recseg button.on { cursor: default; }
.sc-recseg button:hover:not(.on):not(:disabled) { color: var(--text); background: var(--panel-3); }
.sc-recseg button:disabled { opacity: 0.5; cursor: default; }
.sc-recseg i { display: block; width: 7px; height: 7px; background: currentColor; }
.sc-recseg .dot { border-radius: 50%; }
.sc-recseg .sq { border-radius: 1px; }
.sc-recseg .rec.on { background: var(--live-btn); color: #fff; }
.sc-recseg .off.on { background: var(--panel-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
/* A source that does not record: OFF along its picture. */
.sc-pic-off { position: absolute; left: 0; right: 0; bottom: 0; height: 15px; display: grid; place-items: center; background: rgba(5, 6, 10, 0.78); color: var(--text-2); font: 700 8.5px Inter, system-ui, sans-serif; letter-spacing: 0.08em; }

/* Top bar: the server's highest load (processor, memory, disks, bandwidth out). */
.load-gauge { display: inline-flex; align-items: center; gap: 7px; flex: none; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid transparent; background: none; color: var(--text-2); font: inherit; font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
button.load-gauge { cursor: pointer; }
button.load-gauge:hover { background: var(--panel-2); border-color: var(--line); }
.load-gauge .load-bar { position: relative; width: 44px; height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
.load-gauge .load-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--pvw); transition: width 0.6s ease; }
.load-gauge b { min-width: 34px; text-align: right; font-weight: 600; }
.load-gauge.warn { color: var(--warn); }
.load-gauge.warn .load-bar i { background: var(--warn); }
.load-gauge.bad { color: var(--live); }
.load-gauge.bad .load-bar i { background: var(--live); }
@media (max-width: 900px) { .load-gauge .load-bar { display: none; } }

/* A tooltip of several lines (the load gauge's detail): its line breaks kept. */
.follow-tip { white-space: pre-line; align-items: flex-start; }

/* What the preview sees: a black or frozen picture, silence (on the source's picture). */
.sc-content-flags { position: absolute; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 1; }
.sc-content-flag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 85%, #000); color: #111; font-size: 11px; font-weight: 700; }
.sc-content-mark { position: absolute; right: 3px; bottom: 3px; display: grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--warn); color: #111; }

/* Système › Alertes. */
.set-inline { display: flex; align-items: center; gap: 8px; }
.alert-events { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; }
.alert-test { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: 13px; }
.ok-text { color: var(--pvw); font-weight: 600; }
.bad-text { color: var(--live); font-weight: 600; }

/* Extraction: the source's subtitles burnt into the clip (on / off). */

/* Extraction: the sound track heard. */

.st-countdown b { font: 700 12.5px var(--mono); color: var(--text); white-space: nowrap; }
.st-countdown i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--warn); transition: width 1s linear; }
.st-test { flex: none !important; width: 38px; padding: 0; justify-content: center; border: 1px solid var(--line-2) !important; background: var(--panel-3) !important; }
.st-card-act { display: flex; gap: 8px; }
.st-card-act .btn { flex: 1; justify-content: center; }
.st-input { height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-3); color: var(--text); font: 12.5px Inter, sans-serif; }

/* A web page source: its browser's bar, its reframing, its piloting (`ui/PageTools`). */
.pt-bar { position: relative; display: flex; align-items: center; gap: 6px; height: 32px; flex: none; }
.pt-ib { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel-3); color: var(--text-2); cursor: pointer; flex: none; }
.pt-ib:hover:not(:disabled) { color: var(--text); }
.pt-ib:disabled { opacity: 0.4; cursor: default; }
.pt-url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text-3); cursor: text; }
.pt-url:focus-within { border-color: var(--accent); }
.pt-url .pt-globe { flex: none; color: var(--text-3); }
.pt-title { flex: none; max-width: 40%; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-url input { flex: 1; min-width: 0; border: 0; background: none; padding: 0; height: 100%; color: var(--text-3); font: 12.5px var(--mono); outline: none; }
.pt-url.editing input, .pt-url input:focus { color: var(--text); }
.pt-url input:disabled { color: var(--text-3); }
.pt-spin { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--accent); animation: pt-spin 0.8s linear infinite; }
@keyframes pt-spin { to { transform: rotate(360deg); } }
.pt-load { position: absolute; left: 6px; right: 6px; bottom: -4px; height: 2px; border-radius: 2px; overflow: hidden; display: none; }
.pt-bar.loading .pt-load { display: block; }
.pt-load::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--accent); animation: pt-load 1.2s ease-in-out infinite; }
@keyframes pt-load { 0% { left: -40%; } 100% { left: 100%; } }
.pt-take { flex: none; height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel-3); color: var(--text); font: 600 12.5px Inter, sans-serif; cursor: pointer; white-space: nowrap; }
.pt-take:hover:not(:disabled) { border-color: var(--accent); }
.pt-take:disabled { opacity: 0.4; cursor: default; }
.pt-take kbd { font: 600 10px var(--mono); padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); }
.pt-take.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pt-take.on kbd { background: rgba(11, 12, 18, 0.18); }
.pt-catch { position: absolute; inset: 0; z-index: 3; cursor: pointer; }
.pt-hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: rgba(11, 12, 18, 0.8); color: #fff; font-weight: 600; opacity: 0; transition: opacity 0.15s; pointer-events: none; white-space: nowrap; }
.pt-catch:hover .pt-hint { opacity: 1; }
.pt-over { position: absolute; inset: 0; z-index: 6; overflow: hidden; background: #000; touch-action: none; }
.pt-live { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; user-select: none; pointer-events: none; }
.pt-veil { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.25); pointer-events: none; }
.pt-frame { position: absolute; border: 1.5px dashed rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 9999px rgba(11, 12, 18, 0.45); pointer-events: none; }
.pt-grip { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 5px; background: rgba(255, 255, 255, 0.95); color: #111; font: 600 11px Inter, sans-serif; cursor: move; pointer-events: auto; white-space: nowrap; user-select: none; }
.pt-frame i { position: absolute; width: 13px; height: 13px; border-radius: 3px; background: #fff; box-shadow: 0 0 0 1.5px var(--accent); pointer-events: auto; }
.pt-frame i.nw { left: 3px; top: 3px; cursor: nwse-resize; } .pt-frame i.ne { right: 3px; top: 3px; cursor: nesw-resize; }
.pt-frame i.sw { left: 3px; bottom: 3px; cursor: nesw-resize; } .pt-frame i.se { right: 3px; bottom: 3px; cursor: nwse-resize; }
.pt-lab { position: absolute; right: 22px; bottom: 5px; font: 600 10.5px var(--mono); color: #fff; background: rgba(0, 0, 0, 0.6); padding: 2px 6px; border-radius: 4px; }
.pt-ripple { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; border: 2px solid var(--accent); pointer-events: none; animation: pt-ripple 0.6s ease-out forwards; }
@keyframes pt-ripple { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.pt-badge { position: absolute; z-index: 2; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 7px; font: 600 12px Inter, sans-serif; padding: 5px 10px; border-radius: 999px; background: rgba(11, 12, 18, 0.85); color: #fff; pointer-events: none; }
.pt-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--pvw); }
.pt-badge small { color: #aeb3c6; font-weight: 400; }
.pt-below { display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 12.5px; }
.pt-frame-act { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 8px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent-2); white-space: nowrap; }
.pg-layer { pointer-events: none; }
/* Système › Envois des extraits: the places, the form. */
.snd-modal { width: min(820px, 100%); }
.snd-body { margin: 4px 0 8px; }
.snd-kinds { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.snd-kinds button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; text-align: left; }
.snd-kinds button b { font-size: 12.5px; }
.snd-kinds button small { font-size: 11px; color: var(--text-3); }
.snd-kinds button.on { border-color: var(--accent); background: var(--accent-soft); }
.snd-tokens, .snd-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.snd-tokens button { font: 11.5px var(--mono); padding: 2px 7px; border-radius: 5px; background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text-2); cursor: pointer; }
.snd-chips button { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: none; color: var(--text-2); cursor: pointer; }
.snd-chips button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-2); }
.snd-preview { display: block; margin-top: 6px; font: 12px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.io-metrics b.accent { color: var(--accent-2); }
.io-metrics b.mono { font-family: var(--mono); font-weight: 500; }
.io-last { font-size: 11.5px; margin-left: 6px; }
@media (max-width: 760px) { .snd-kinds { grid-template-columns: repeat(2, 1fr); } }
/* Extraits: where each clip was sent; the sends going. */
.io-proto.small { font-size: 9.5px; padding: 3px 5px; }
.snd-chips-row { display: flex; flex-wrap: wrap; gap: 4px; }
.snd-st { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line-2); background: none; color: var(--text-2); font: inherit; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snd-st:disabled { cursor: default; }
.snd-st.done { color: var(--pvw); border-color: rgba(34, 197, 94, 0.3); }
.snd-st.running { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.snd-st.queued { color: var(--text-3); }
.snd-st.error { color: var(--live); border-color: color-mix(in srgb, var(--live) 45%, transparent); cursor: pointer; }
.snd-st.error:disabled { cursor: default; }
.snd-panel { position: fixed; right: 22px; bottom: 22px; z-index: 40; width: 420px; max-width: calc(100vw - 32px); border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55); }
.snd-panel header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; }
.snd-panel header .muted { margin-left: auto; font-size: 12px; }
.snd-panel-list { max-height: 280px; overflow: auto; border-top: 1px solid var(--line); }
.snd-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 14px; border-top: 1px solid var(--line); }
.snd-row:first-child { border-top: 0; }
.snd-row-t { min-width: 0; display: flex; flex-direction: column; }
.snd-row-t b, .snd-row-t small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snd-row-t small { color: var(--text-3); font-size: 11.5px; }
.snd-row.error .snd-row-t small { color: var(--live); }
.snd-row-r { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.snd-row-r small { color: var(--text-3); }
.snd-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.snd-bar i { display: block; height: 100%; background: var(--accent); transition: width 0.4s; }
.snd-bar i.busy { animation: snd-busy 1.2s ease-in-out infinite; }
@keyframes snd-busy { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

/* Extraction: the one button (seen, then made), and its window: the clip played on the left, what
   to make of it on the right, the extraction under them. */
.sc-xbtn:not(.busy) { width: auto; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; }
.sc-xmodal { width: min(1120px, 100%); }
.sc-xmodal-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 18px; align-items: start; }
.sc-xmodal-view { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sc-xmodal-view .sc-clip-bar { flex-wrap: wrap; }
.sc-xmodal-side { max-height: min(70vh, 640px); overflow: auto; padding-right: 2px; }
.sc-xmodal-foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.sc-xm-w { font: 700 14px var(--mono); }
.sc-xm-w.over { color: var(--warn); }
.xc { display: flex; flex-direction: column; gap: 12px; }
.xc-field { display: flex; flex-direction: column; gap: 6px; }
.xc-lab { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.xc-list { display: flex; flex-direction: column; gap: 4px; }
.xc-fmt { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--text); text-align: left; font: inherit; cursor: pointer; }
.xc-fmt:hover { background: var(--panel-2); }
.xc-fmt.on { border-color: var(--accent); background: var(--accent-soft); }
.xc-fmt .xc-dot { grid-row: 1 / span 2; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.xc-fmt.on .xc-dot { border: 4px solid var(--accent); }
.xc-fmt b { font-size: 13px; }
.xc-fmt small { grid-column: 2; color: var(--text-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xc-fmt em { grid-row: 1 / span 2; grid-column: 3; font: 600 12.5px var(--mono); font-style: normal; color: var(--text-2); white-space: nowrap; }
.xc-dst { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.xc-dst:hover:not(:disabled):not(.lock) { background: var(--panel-2); }
.xc-dst.lock { cursor: default; opacity: 0.75; }
.xc-dst b { font-size: 13px; white-space: nowrap; }
.xc-dst small { margin-left: auto; color: var(--text-3); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.xc-dst small.xc-path { direction: rtl; text-align: right; }
.xc-cb { width: 15px; height: 15px; flex: none; border-radius: 4px; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: var(--on-accent); }
.xc-dst.on .xc-cb { background: var(--accent); border-color: var(--accent); }
@media (max-width: 900px) { .sc-xmodal-body { grid-template-columns: 1fr; } .sc-xmodal-side { max-height: none; } }
.sc-edit .sc-center.sc-wide { grid-column: span 2; }
/* The place's folder: checked as it is written, chosen among those there. */
.snd-folder { display: flex; gap: 8px; }
.snd-folder input { flex: 1; min-width: 0; }
.snd-check { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--text-3); }
.snd-check.ok { color: var(--pvw); }
.snd-check.warn { color: var(--warn); }
.snd-check.bad { color: var(--live); }
.snd-browse { margin-top: 8px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--panel-2); overflow: hidden; }
.snd-browse-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.snd-browse-head code { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snd-browse-list { max-height: 200px; overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.snd-browse-list .muted { display: inline-flex; align-items: center; gap: 6px; padding: 6px; }
.snd-dir { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.snd-dir:hover { background: var(--panel-3); }
.snd-dir svg { color: var(--accent-2); flex: none; }

/* Système › Sources: grouped by kind, compact cards (V25). */
.src-group { margin-top: 20px; }
.src-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--text-2); }
.src-group-ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--panel-2); color: var(--text-3); }
.src-group-head h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.src-group-n { font-size: 11px; color: var(--text-3); background: var(--panel-2); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.src-group-line { flex: 1; height: 1px; background: var(--line); }
.src-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 8px; }
.src-card { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px 8px 8px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.src-card:hover { border-color: var(--line-2); }
.src-card.rec { border-color: color-mix(in srgb, var(--live) 28%, var(--line)); }
.src-thumb { position: relative; width: 112px; aspect-ratio: 16 / 9; border-radius: 7px; overflow: hidden; background: #05060a; }
.src-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.src-thumb .sc-pic { position: absolute; inset: 0; }
.src-onpic { position: absolute; left: 5px; bottom: 5px; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: rgba(0, 0, 0, 0.65); color: var(--text-2); }
.src-onpic.bad { color: var(--warn); }
.src-spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); border-top-color: var(--text); animation: spin 0.8s linear infinite; }
.src-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.src-title { display: flex; align-items: center; gap: 7px; min-width: 0; }
.src-title strong { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-badge { flex: none; font-size: 10.5px; color: var(--text-3); }
.src-sub { display: flex; min-width: 0; font: 11px var(--mono); color: var(--text-3); }
.src-addr { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-line { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); min-width: 0; height: 16px; }
.src-line.dim { color: var(--text-3); }
.src-line.air { color: color-mix(in srgb, var(--live) 70%, var(--text)); }
.src-line.air .sc-rec { width: 6px; height: 6px; }
.src-line.bad { color: var(--live); }
.src-line-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-line-time { flex: none; font-variant-numeric: tabular-nums; color: var(--text-3); }
.src-loop { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.src-loop .perf-bar { flex: 1; height: 4px; }
.src-loop-v { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.src-loop-v b { color: var(--text-2); font-weight: 600; }
.src-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.src-icons { display: flex; gap: 2px; }
.src-icons .icon-btn { width: 26px; height: 26px; }
.src-caret { opacity: 0.6; margin-left: -2px; }
.menu-note { padding: 6px 10px 5px; font-size: 11px; color: var(--text-3); }
.menu-side { margin-left: auto; padding-left: 14px; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.menu-side.warn { color: var(--warn); }

/* Extraction: the sound's level (V27b): a button in the transport, its panel above it. */
.xl-wrap { position: relative; flex: none; }
.xl-btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text-2); font: inherit; font-size: 12.5px; cursor: pointer; }
.xl-btn:hover, .xl-btn.open { background: var(--panel-3); border-color: var(--line-2); color: var(--text); }
.xl-btn b { font: 700 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.xl-btn.mod { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.xl-btn.mod b { color: var(--accent-2); }
.xl-mini { display: flex; gap: 2px; width: 9px; height: 18px; }
.xl-mini > span { flex: 1; position: relative; border-radius: 1px; background: var(--panel-3); overflow: hidden; }
.xl-mini i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; }
.xl-pop { position: absolute; bottom: calc(100% + 8px); z-index: 30; width: 330px; padding: 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); }
.xl-pop.right { right: 0; }
.xl-pop.left { left: 0; }
.xl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; font-weight: 600; }
.xl-zero { border: 0; background: none; padding: 0; font: 600 11px var(--mono); color: var(--text-3); cursor: pointer; }
.xl-zero:hover:not(:disabled) { color: var(--text); }
.xl-zero:disabled { opacity: 0.35; cursor: default; }
.xl-meters { display: grid; gap: 4px; margin-bottom: 12px; }
.xl-row { display: grid; grid-template-columns: 12px 1fr; gap: 6px; align-items: center; font: 9.5px var(--mono); color: var(--text-3); }
.xl-bar { position: relative; height: 7px; border-radius: 2px; background: #1a1d28; overflow: hidden; }
.xl-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
.xl-bar em { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -2px; background: #fff; opacity: 0; }
.xl-marks { position: relative; height: 12px; margin-left: 18px; font: 9.5px var(--mono); color: var(--text-3); }
.xl-marks span { position: absolute; transform: translateX(-50%); }
.xl-marks span:last-child { transform: translateX(-100%); }
.xl-fader { display: flex; align-items: center; gap: 10px; font: 11px var(--mono); color: var(--text-3); }
.xl-fader input { flex: 1; min-width: 0; accent-color: var(--accent); }
.xl-fader + .xl-fader { margin-top: 8px; }
.xl-fader.end { justify-content: flex-end; }
.xl-fader.apart b { font: 700 11px var(--mono); color: var(--text); width: 58px; text-align: right; flex: none; }
.xl-who { width: 10px; font-weight: 700; color: var(--text-2); }
.xl-ch { display: flex; margin: 0 0 12px; }
.xl-route { font: 600 10px Inter, sans-serif; letter-spacing: 0.04em; color: var(--text-3); }

/* Système › Accès: groups with their rights (V28). */
.gr-sec { margin: 20px 2px 10px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
.gr-sec::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.gr-rights { display: flex; flex-direction: column; gap: 10px; }
.gr-part { display: flex; flex-direction: column; gap: 4px; }

.gr-tags { display: flex; flex-wrap: wrap; gap: 4px; position: relative; }
.gr-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: color-mix(in srgb, var(--gc) 16%, transparent); color: var(--gc); --gc: #a78bfa; }
.gr-tag.operators { --gc: var(--accent); }
.gr-tag.streamers { --gc: #f472b6; }
.gr-tag.viewers { --gc: #2dd4bf; }
.gr-tag.admin { --gc: var(--warn); }

.gr-admin { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 4px 0 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); background: color-mix(in srgb, var(--warn) 6%, transparent); cursor: pointer; }

.rl-wrap { overflow-x: auto; }

/* Sources: put in order by dragging (a source inside its kind, a kind among the others). */

.src-grip { display: inline-grid; place-items: center; width: 18px; height: 22px; margin-left: -4px; color: var(--text-3); cursor: grab; border-radius: 5px; }

.src-slot.dragging, .src-group.dragging { opacity: 0.4; }
.src-slot.drop-before::before, .src-slot.drop-after::after { content: ''; position: absolute; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--accent); }

.src-group.drop-after::after { bottom: -10px; }

/* Système › Groupes: the group's window, by tabs (members, rights, sources, file servers, destinations). */
.gr-scopes { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--text-3); border-top: 1px solid var(--line); padding-top: 8px; }

.gm { display: flex; flex-direction: column; max-height: min(760px, calc(100vh - 40px)); }
.gm header { gap: 10px; }
.gm-name { flex: 1; min-width: 0; height: 34px; font-size: 15px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; color: var(--text); }
.gm-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 200px 1fr; gap: 18px; }
.gm-tabs { display: flex; flex-direction: column; gap: 2px; }

.gm-tabs button:hover { background: var(--panel-2); color: var(--text); }

.gm-tabs button span { flex: 1; }

.gm-part.dim { opacity: 0.7; }
.gm-part h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
.gm-sub { display: flex; flex-direction: column; gap: 4px; }
.gm-sub-name { font-size: 11.5px; font-weight: 600; color: var(--text-2); margin-top: 4px; }
.gm-col { display: flex; flex-direction: column; gap: 4px; }
.gm-row { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.gm-scope { display: flex; flex-direction: column; gap: 10px; }
.gm-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.gm-list.off { opacity: 0.5; }
.gm-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; min-width: 0; }
.gm-item.on { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: var(--accent-soft); }
.gm-item b { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rl-table tr.rl-sub td { font-size: 11.5px; font-weight: 600; color: var(--text-2); padding: 8px 10px 4px 18px; }

/* An account with no right at all. */
.no-rights { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); text-align: center; padding: 24px; }

.no-rights p { margin: 0; }
.sc-kinds { margin: 0 0 10px; }
.sc-kinds .asr-chip svg { width: 12px; height: 12px; vertical-align: -2px; }

/* Control Room: a programme's card (V29 B). */
.sc-epg-card { position: fixed; z-index: 3000; width: 310px; display: grid; grid-template-columns: 78px 1fr; border-radius: 12px; background: rgba(24, 27, 38, 0.97); border: 1px solid var(--line-2); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); overflow: hidden; pointer-events: none; }
.sc-epg-time { padding: 12px 0 12px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); background: var(--panel-2); }
.sc-epg-time b { font: 700 18px var(--mono); color: var(--text); }
.sc-epg-time span { font: 11px var(--mono); color: var(--text-3); }
.sc-epg-time em { margin-top: 6px; font-style: normal; font-size: 11px; color: var(--text-3); }
.sc-epg-body { padding: 12px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }

.sc-epg-body p { margin: 0; color: var(--text-2); font-size: 12px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sc-epg-act { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 4px 9px; border-radius: 7px; background: var(--accent); color: var(--on-accent, #0b0c12); font-size: 11.5px; font-weight: 600; }

/* Système › Ressources */
.rs-alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; margin-bottom: 14px; border-radius: 10px; border: 1px solid; }
.rs-alert.bad { border-color: rgba(255, 59, 92, 0.45); background: rgba(255, 59, 92, 0.08); color: #ff8da1; }
.rs-alert.warn { border-color: rgba(245, 165, 36, 0.45); background: rgba(245, 165, 36, 0.08); color: var(--warn); }
.rs-alert > div { display: flex; flex-direction: column; gap: 3px; }
.rs-alert b { color: var(--text); font-size: 13.5px; }
.rs-alert span { color: var(--text-2); font-size: 12.5px; }
.rs-gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; padding: 16px; }
.rs-g { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); min-width: 0; }
.rs-g-l { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.rs-g-v { font-size: 24px; }
.rs-g.warn .rs-g-v { color: var(--warn); }
.rs-g.bad .rs-g-v { color: #ff8da1; }
.rs-g-bar { position: relative; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); margin: 4px 0 14px; }

.rs-g.bad .rs-g-bar > i { background: var(--live); }
.rs-g-bar > em { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; }
.rs-g-bar > small { position: absolute; top: 11px; transform: translateX(-50%); font-size: 10px; color: var(--text-3); white-space: nowrap; }
.rs-g-s { font-size: 12px; color: var(--text-3); }
.rs-g-more { font-size: 11.5px; }
.rs-room { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 16px 16px; }
.rs-room-k { font-size: 12.5px; color: var(--text-2); margin-right: 4px; }
.rs-room-chip { font-size: 12px; padding: 4px 10px; border-radius: 14px; background: var(--panel-3); color: var(--text-2); border: 1px solid var(--line-2); }
.rs-room-chip.none { color: #ff8da1; border-color: rgba(255, 59, 92, 0.4); background: rgba(255, 59, 92, 0.08); }
.rs-room-chip.ok { color: #6ee7a0; border-color: rgba(63, 174, 106, 0.45); background: rgba(63, 174, 106, 0.1); }
.rs-sort { font-size: 12px; font-weight: 400; }
.rs-table td { vertical-align: middle; }
.rs-table tr.rs-hot td { background: rgba(255, 59, 92, 0.05); }
.rs-flow { display: flex; align-items: center; gap: 10px; }
.rs-flow-t { display: flex; flex-direction: column; min-width: 0; }
.rs-flow-t b { display: inline-flex; align-items: center; gap: 6px; }
.rs-flow-t small { font-size: 11px; color: var(--text-3); }
.rs-kind { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--panel-3); color: var(--text-2); flex: none; }
.rs-parts { display: flex; flex-wrap: wrap; gap: 4px; max-width: 280px; }
.rs-part { font-size: 10.5px; padding: 2px 7px; border-radius: 10px; background: var(--panel-3); color: var(--text-2); white-space: nowrap; }
.rs-cpu { min-width: 160px; }
.rs-cpu-v { font-size: 12.5px; color: var(--text-2); }
.rs-cpu-v b { color: var(--text); font-size: 14px; }
.rs-bar { display: block; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.07); margin: 4px 0 3px; overflow: hidden; }
.rs-bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.rs-bar i.bad { background: var(--live); }
.rs-bar i.warn { background: var(--warn); }
.rs-cpu small { font-size: 11px; color: var(--text-3); }
.rs-spark { display: block; }
.rs-spark polyline { stroke: var(--accent); }
.rs-spark.bad polyline { stroke: var(--live); }
.rs-spark.warn polyline { stroke: var(--warn); }
.rs-state-cell { display: inline-flex; align-items: center; gap: 8px; }
.rs-st { font-size: 11.5px; padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
.rs-st.ok { background: rgba(63, 174, 106, 0.14); color: #6ee7a0; }
.rs-st.warn { background: rgba(245, 165, 36, 0.15); color: var(--warn); }
.rs-st.bad { background: rgba(255, 59, 92, 0.16); color: #ff8da1; }

/* Santé: whom a message is about */
.lw-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.lw-chip { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 14px; border: 1px solid var(--line-2); background: none; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.lw-chip b { color: var(--text-3); font-weight: 500; margin-left: 3px; }
.lw-chip:hover { color: var(--text); }
.lw-chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--text); }
.lw-inc { display: grid; grid-template-columns: 10px minmax(110px, 170px) 1fr auto; gap: 14px; align-items: start; padding: 12px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.lw-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: var(--warn); }
.lw-dot.bad, .lw-dot.crash { background: var(--live); }
.lw-who { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text); padding: 3px 9px; border-radius: 7px; background: var(--panel-3); justify-self: start; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.lw-who svg { color: var(--text-3); flex: none; }

.lw-ico svg { width: 12px; height: 12px; }

.lw-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lw-main strong { font-size: 13.5px; }
.lw-main > span { font-size: 12.5px; color: var(--text-2); }
.lw-main details { font-size: 11.5px; color: var(--text-3); }
.lw-main summary { cursor: pointer; width: max-content; }
.lw-main code { display: block; margin-top: 4px; font: 11px var(--mono); color: var(--text-3); white-space: pre-wrap; word-break: break-word; }
.lw-line { align-items: center; }
.lw-tech { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.lw-line .log-lvl { width: 96px; }
.lw-line .lw-who { flex: none; width: 150px; }
.lw-line .log-msg { min-width: 0; }

/* styles-light.css — thème clair : seulement des surcharges ; le sombre est le défaut */
:root[data-theme='light'] {
  --bg: #eef0f5; --panel: #ffffff; --panel-2: #f5f6fa; --panel-3: #e9ecf3;
  --line: #dde1ea; --line-2: #cfd4e0;
  --text: #161925; --text-2: #4f5670; --text-3: #6b7290;
  --accent: #4f63e6; --accent-2: #3a4bc4; --accent-soft: rgba(79, 99, 230, 0.12);
  --mask: #0d9488; --on-accent: #ffffff;
  --live: #e11d48; --live-soft: rgba(225, 29, 72, 0.12); --live-btn: #e11d48;
  --pvw: #15803d; --warn: #b45309; --key: #a16207;      /* vert et orange foncés pour le texte sur blanc */
  --pvw-fill: #22c55e; --warn-fill: #f5a524;             /* aplats à encre sombre : teintes vives */
  /* texte de couleur sur fond clair (le sombre utilise des teintes pâles, ex. #ff8aa0 pour le rouge) */
  --t-red: #c8183f; --t-green: #15803d; --t-blue: #0369a1; --t-yellow: #a16207; --t-pink: #be185d; --t-violet: #6d28d9; --t-orange: #c2410c;
  color-scheme: light;
}
/* Les images (aperçus, vignettes, consoles de journal) restent sombres dans les deux thèmes : remettre les jetons sombres sur leur conteneur,
   par ex. :root[data-theme='light'] :is(.log-box, .media-preview) { --bg: #0b0c12; --panel: #12141d; … color-scheme: dark; } */
:root[data-theme='light'] .topbar { background: var(--panel); }
:root[data-theme='light'] :is(.brand .brand-f-lead, .brand-name) { color: var(--text); }
:root[data-theme='light'] .tabs button.on { box-shadow: 0 1px 2px rgba(22, 25, 37, 0.08); }
:root[data-theme='light'] :is(.ux1-mi.danger, .ux1-mi.danger svg) { color: var(--t-red); }
:root[data-theme='light'] .ux1-pill.lost { color: var(--t-red); background: rgba(225, 29, 72, 0.1); }
:root[data-theme='light'] .ux1-user-btn.on .avatar { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
:root[data-theme='light'] .ux1-cap { border-color: color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); }
:root[data-theme='light'] :is(.library, .settings) { background: var(--bg); }
:root[data-theme='light'] :is(.project-card:hover, .user-card:hover) { box-shadow: 0 6px 18px rgba(22, 25, 37, 0.1); }
:root[data-theme='light'] .btn.warn { background: var(--warn-fill); border-color: var(--warn-fill); }
:root[data-theme='light'] .modal-back { background: rgba(22, 25, 37, 0.35); }
:root[data-theme='light'] .modal.dialog.danger .dialog-icon { color: var(--t-red); }
:root[data-theme='light'] .login-page { background: radial-gradient(ellipse at 30% 0%, #dfe3fb 0%, var(--bg) 60%); }

/* Strata LiveCut — business screens */
:root[data-theme='light'] :is(.sc-thumb, .sc-viewer, .sc-strip) { --bg: #0b0c12; --panel: #12141d; --panel-2: #181b26; --panel-3: #1f2331; --line: #262a3a; --line-2: #323750; --text: #e6e8f2; --text-2: #a3a8bf; --text-3: #8a90ad; color-scheme: dark; }
:root[data-theme='light'] .perf-bar { background: var(--panel-3); }
:root[data-theme='light'] .sc-center { background: var(--bg); }
:root[data-theme='light'] .sc-wave svg { color: var(--pvw); }
:root[data-theme='light'] .sc-sel::before, :root[data-theme='light'] .sc-sel::after { color: #fff; }

/* Cadre : rôles, badges, journal */
:root[data-theme='light'] .user-card.role-admin { --role: var(--t-red); }
:root[data-theme='light'] :is(.badge.role-admin, .badge.bad) { color: var(--t-red); }
:root[data-theme='light'] .badge.crash { color: var(--t-violet); }
:root[data-theme='light'] .log-box { --bg: #0b0c12; --panel: #12141d; --panel-2: #181b26; --panel-3: #1f2331; --line: #262a3a; --line-2: #323750; --text: #e6e8f2; --text-2: #a3a8bf; --text-3: #8a90ad; --accent-2: #bfcaff; --pvw: #22c55e; --warn: #f5a524; color-scheme: dark; }

<style>
/* ===== Maquette : éléments nouveaux du Core, jetons uniquement ===== */
.mk-sec { font-size: var(--fs-11); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin: 6px 0 -6px; }
/* Tuiles d'applis (cockpit A) */
.mk-app-head { height: 118px; display: grid; place-items: center; border-radius: 13px 13px 0 0; border-bottom: 1px solid var(--line); background: radial-gradient(ellipse at 30% 0%, var(--accent-soft), transparent 70%), var(--panel-2); }
.mk-ico { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-2); flex: none; }
.mk-ico.sm { width: 36px; height: 36px; border-radius: 10px; }
.mk-ico.xs { width: 28px; height: 28px; border-radius: 8px; }
.mk-ico.off { background: var(--panel-3); color: var(--text-3); }
.mk-addr { font: 11.5px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; font-size: 12px; color: var(--text-2); }
.project-card.mk-click { cursor: pointer; }
/* Tuiles compactes (B) */
.mk-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.mk-tile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; }
.mk-tile:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35); }
.mk-tile strong { display: block; font-size: 14px; }
.mk-tile small { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; }
/* Lanceur (C) */
.mk-launch-page { height: 100%; overflow: auto; background: radial-gradient(ellipse at top, #141725 0%, #0b0c12 60%); display: flex; flex-direction: column; align-items: center; padding: 9vh 24px 60px; gap: 34px; }
:root[data-theme='light'] .mk-launch-page { background: var(--bg); }
.mk-launch-head { text-align: center; }
.mk-launch-head h1 { margin: 0; font-size: 22px; font-weight: 800; }
.mk-launch-head p { margin: 4px 0 0; }
.mk-launch { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 900px; }
.mk-big { width: 176px; height: 176px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; }
.mk-big:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35); }
.mk-big strong { font-size: 15px; }
.mk-alert-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--warn); font-size: 12.5px; cursor: pointer; }
/* Lanceur dans la barre (C) et menu de la marque (A) */
.mk-anchor { position: relative; flex: none; }
.mk-brand-btn { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 8px 4px 4px; margin-left: -4px; border-radius: 8px; cursor: pointer; color: var(--text-3); }
.mk-brand-btn:hover, .mk-brand-btn.on { background: var(--panel-2); }
.menu.mk-switch { min-width: 240px; }
.menu.mk-launcher { width: 330px; }
.mk-l-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px; font-size: 12px; color: var(--text-3); }
.mk-l-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.mk-l-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border-radius: 10px; border: 0; background: none; color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer; }
.mk-l-item:hover, .mk-l-item.on { background: var(--accent-soft); }
.mk-sq { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 0; background: none; color: var(--text-2); cursor: pointer; }
.mk-sq:hover, .mk-sq.on { background: var(--panel-3); color: var(--text); }
/* Rail (B) */
.mk-shell { display: flex; height: 100%; }
.mk-shell > .app { flex: 1; min-width: 0; }
.mk-rail { width: 62px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 0 12px; background: var(--panel); border-right: 1px solid var(--line); }
.mk-rail-sep { width: 28px; height: 1px; background: var(--line); margin: 4px 0; }
.mk-rail-btn { position: relative; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; border: 0; background: none; color: var(--text-2); cursor: pointer; }
.mk-rail-btn:hover { background: var(--panel-3); color: var(--text); }
.mk-rail-btn.on { background: var(--accent-soft); color: var(--accent-2); }
.mk-rail-btn.on::before { content: ''; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.mk-rail-logo { width: 42px; height: 34px; display: grid; place-items: center; color: var(--text); margin-bottom: 4px; }
:root[data-theme='light'] .mk-rail-logo { color: var(--text); }
/* Mesures */
.mk-meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .mk-meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mk-meter { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.mk-meter-h { display: flex; align-items: baseline; gap: 8px; color: var(--text-2); font-size: 12px; }
.mk-meter-h b { margin-left: auto; color: var(--text); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mk-meter .muted { font-size: 11.5px; }
.mk-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .mk-cols { grid-template-columns: 1fr; } }
.mk-lines { display: flex; flex-direction: column; }
.mk-line { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 12.5px; }
.mk-line + .mk-line { border-top: 1px solid var(--line); }
.mk-line .grow { flex: 1; min-width: 0; }
.mk-line .muted { font-size: 12px; }
.badge.ok { background: color-mix(in srgb, var(--pvw) 15%, transparent); color: var(--pvw); }
.badge.acc { background: var(--accent-soft); color: var(--accent-2); }
.hw-dot.ok { background: var(--pvw); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pvw) 18%, transparent); }
.hw-dot.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }
.mk-port-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mk-port-name strong { min-width: 52px; }
.mk-port-name .dd-btn { width: 110px; height: var(--h-control-dense); }
.hw-port .mono { font: 12px var(--mono); }
.mk-uses { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.user-table td.r { text-align: right; white-space: nowrap; }
.user-table .mono { font-family: var(--mono); font-size: 12px; }
.mk-apphead { display: flex; align-items: center; gap: 14px; }
.mk-apphead h1 { margin: 0; font-size: 22px; font-weight: 800; }
.mk-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.mk-libcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.mk-libcard.off { opacity: 0.85; }
.mk-libcard-h { display: flex; align-items: center; gap: 12px; }
.mk-libcard-h div { flex: 1; min-width: 0; }
.mk-libcard-h strong { display: block; font-size: 14.5px; }
.mk-libcard-f { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.mk-libcard .check { font-size: 12.5px; }
.mk-sso-row { display: flex; align-items: center; gap: 10px; }
.mk-tabbar { margin: -4px 0 0; }
.mk-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* Corps d'une appli (fictif) : images de la maquette de LiveCut */
.sc-pic.p1 { background: radial-gradient(ellipse at 30% 40%, #3a4a7a 0%, transparent 55%), radial-gradient(ellipse at 75% 70%, #6b3a52 0%, transparent 50%), linear-gradient(160deg, #1a1f33, #0a0b12); }
.sc-pic.p2 { background: radial-gradient(ellipse at 60% 30%, #2f6b62 0%, transparent 55%), radial-gradient(ellipse at 20% 80%, #22304f 0%, transparent 55%), linear-gradient(200deg, #12202a, #07080c); }
.sc-pic.p3 { background: radial-gradient(ellipse at 50% 55%, #7a5a2a 0%, transparent 50%), linear-gradient(180deg, #23283b, #0b0c12); }
.sc-pic.p4 { background: radial-gradient(ellipse at 35% 35%, #4b3a7a 0%, transparent 55%), radial-gradient(ellipse at 80% 60%, #2a5a7a 0%, transparent 50%), linear-gradient(140deg, #171a2b, #08090e); }
.mk-appbody .project-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
/* Commandes de la maquette */
/* Aucun cadre de focus (décision : le cadre bleu est retiré partout) */
:focus, :focus-visible { outline: none !important; }
.ux1-user-btn.on .avatar { box-shadow: none !important; }
.mock-note { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9000; display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: #000; color: #fff; font: 11px Inter, system-ui, sans-serif; opacity: 0.9; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); white-space: nowrap; }
.mock-note button { border: 1px solid #444; background: #111; color: #ddd; border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
.mock-note button.on { background: #fff; color: #000; }
.mock-note i { width: 1px; height: 18px; background: #444; margin: 0 4px; }
.mock-note span { color: #aaa; padding: 0 4px; }
.mock-note { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 760px) { .mock-note { flex-wrap: wrap; justify-content: center; white-space: normal; width: calc(100% - 32px); } .topbar { overflow-x: auto; } }
</style>
<style>
/* ===== Maquette C : navigateur simulé, plusieurs serveurs ===== */
:root { --ch-bg: #0d0e12; --ch-tab: #191b22; --ch-on: #23262f; --ch-text: #c9ccd6; --ch-dim: #858a9c; }
:root[data-theme='light'] { --ch-bg: #d9dce3; --ch-tab: #e6e8ee; --ch-on: #f7f8fa; --ch-text: #2a2e3a; --ch-dim: #5d6273; }
html, body { background: var(--bg); }
#root { display: flex; flex-direction: column; height: 100%; }
.mk-browser { flex: none; background: var(--ch-bg); color: var(--ch-text); font: 12px Inter, system-ui, sans-serif; }
.mk-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0; overflow-x: auto; }
.mk-btab { display: flex; align-items: center; gap: 8px; height: 32px; min-width: 120px; max-width: 230px; padding: 0 8px 0 12px; border-radius: 9px 9px 0 0; background: var(--ch-tab); color: var(--ch-dim); cursor: pointer; flex: none; }
.mk-btab:hover { color: var(--ch-text); }
.mk-btab.on { background: var(--ch-on); color: var(--ch-text); }
.mk-btab-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-fav { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-2); flex: none; }
.mk-x { display: grid; place-items: center; width: 18px; height: 18px; border: 0; border-radius: 4px; background: none; color: inherit; cursor: pointer; padding: 0; }
.mk-x:hover { background: rgba(127, 127, 127, 0.25); }
.mk-url { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; background: var(--ch-on); border-bottom: 1px solid var(--line); color: var(--ch-dim); }
.mk-url b { color: var(--ch-text); font-weight: 500; }
.mk-page { flex: 1; min-height: 0; }
.mk-page > .app { height: 100%; }
/* Tuiles par appli */
.mk-big { height: auto; min-height: 176px; padding: 18px 12px 14px; gap: 10px; }
.mk-big.dim { opacity: 0.5; cursor: default; }
.mk-big.dim:hover { transform: none; box-shadow: none; border-color: var(--line); }
.mk-big .muted { font-size: 12px; }
.mk-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.mk-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
.mk-pill:hover { border-color: var(--accent); background: var(--accent-soft); }
.mk-pill:disabled { opacity: 0.5; cursor: default; border-color: var(--line); background: none; }
.mk-pill .nav-dot { width: 6px; height: 6px; }
/* Serveurs (administrateurs) */
.mk-servers { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.mk-srv { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text-2); font: inherit; font-size: 12.5px; cursor: pointer; }
.mk-srv:hover { border-color: var(--line-2); color: var(--text); }
.mk-srv b { color: var(--text); font-weight: 600; }
.mk-srv .warn-t { color: var(--warn); }
.mk-srv .bad-t { color: var(--live); }
.nav-dot.bad { background: var(--live); box-shadow: 0 0 0 3px var(--live-soft); }
/* Lanceur */
.menu.mk-launcher { width: 360px; padding: 6px; }
.mk-lrow { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 8px; border-radius: 8px; }
.mk-lrow.click { cursor: pointer; }
.mk-lrow.click:hover, .mk-lrow.on { background: var(--accent-soft); }
.mk-lrow strong { flex: 1; font-weight: 600; }
.mk-lrow .mk-pill { height: 24px; font-size: 11.5px; }
.mk-srv-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--panel-3); color: var(--text-2); font-size: 12px; flex: none; }
.mk-code { font: 700 26px/1 var(--mono); letter-spacing: 0.12em; color: var(--text); padding: 14px; border-radius: 10px; background: var(--panel-2); border: 1px dashed var(--line-2); text-align: center; }
.mk-modal-body { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>

// Applis du cockpit, regroupées par appli : les instances actives où l'utilisateur a des droits.
function byApp() {
  const out = [];
  for (const i of INST.filter((i) => i.state === 'active' && (isAdmin() || i.user))) {
    let g = out.find((g) => g.app === i.app);
    if (!g) out.push((g = { app: i.app, list: [] }));
    g.list.push(i);
  }
  return out;
}

// ------------------------------------------------------------------ ouvrir, fermer
function activate(id) { S.active = id; S.menu = null; }
function openApp(key) {
  const i = inst(key);
  if (!sv(i.sv).up) return;
  const id = 'app:' + key;
  if (!S.tabs.find((t) => t.id === id)) S.tabs.push({ id, kind: 'app', key });
  activate(id);
}
function openSettings(id, page) {
  if (id === MASTER.id) { const c = S.tabs[0]; c.view = 'settings'; c.page = page || c.page || 'overview'; return activate('cockpit'); }
  const tid = 'set:' + id;
  let t = S.tabs.find((t) => t.id === tid);
  if (!t) S.tabs.push((t = { id: tid, kind: 'settings', sv: id, page: 'overview' }));
  if (page) t.page = page;
  activate(tid);
}
function tabTitle(t) {
  if (t.kind === 'cockpit') return t.view === 'settings' ? `Réglages · ${MASTER.name}` : 'Strata';
  if (t.kind === 'settings') return `Réglages · ${sv(t.sv).name}`;
  const i = inst(t.key);
  return `${APPS[i.app].name} · ${sv(i.sv).name}`;
}
function tabUrl(t) {
  if (t.kind === 'cockpit') return t.view === 'settings' ? [host(MASTER), '/reglages'] : [host(MASTER), '/'];
  if (t.kind === 'settings') return [host(sv(t.sv)), '/reglages'];
  return [instUrl(inst(t.key)), '/'];
}

// Bouton d'une instance : le nom du serveur (Régie A…), l'hôte et ses alertes en plus pour les administrateurs.
function instPill(i) {
  const s = sv(i.sv);
  if (!s.up) return `<button class="mk-pill" disabled title="${isAdmin() ? `${s.id} injoignable` : 'Indisponible'}">${isAdmin() ? `<span class="nav-dot bad"></span>${s.name}` : `${s.name} · indisponible`}</button>`;
  const dot = isAdmin() ? `<span class="nav-dot ${s.alerts ? 'warn' : 'ok'}"></span>` : '';
  return `<button class="mk-pill" data-inst="${instKey(i)}" title="${isAdmin() ? `${s.id}${s.alerts ? ` · ${s.alerts} alerte` : ''}` : ''}">${dot}${s.name}</button>`;
}

// Le lanceur ⊞, le même dans tous les onglets.
function launcher(curKey) {
  return `<div class="menu mk-launcher">
    <div class="mk-l-head"><span>Applis</span><button class="btn small ghost" data-home>${ic('grid-3x3', 13)} Cockpit</button></div>
    ${byApp().map((g) => {
      const A = APPS[g.app];
      const one = g.list.length === 1 && sv(g.list[0].sv).up;
      return `<div class="mk-lrow ${one ? 'click' : ''} ${g.list.some((i) => instKey(i) === curKey) ? 'on' : ''}" ${one ? `data-inst="${instKey(g.list[0])}"` : ''}><span class="mk-ico xs">${ic(A.icon, 15)}</span><strong>${A.name}</strong>
        ${one ? (isAdmin() ? `<span class="muted">${sv(g.list[0].sv).name}</span>` : '') : g.list.map(instPill).join('')}</div>`;
    }).join('')}
  </div>`;
}
const launchBtn = (curKey) => `<div class="mk-anchor"><button class="mk-sq ${S.menu === 'launch' ? 'on' : ''}" data-menu="launch" title="Applis">${ic('grid-3x3', 17)}</button>${S.menu === 'launch' ? launcher(curKey) : ''}</div>`;

// ------------------------------------------------------------------ le cockpit
function cockpit() {
  const groups = byApp();
  const tiles = groups.map((g) => {
    const A = APPS[g.app];
    const up = g.list.filter((i) => sv(i.sv).up);
    if (!up.length) return `<div class="mk-big dim"><span class="mk-ico off">${ic(A.icon, 28)}</span><strong>${A.name}</strong><span class="muted">Indisponible</span></div>`;
    if (g.list.length === 1) {
      const s = sv(g.list[0].sv);
      return `<div class="mk-big" data-inst="${instKey(g.list[0])}"><span class="mk-ico">${ic(A.icon, 28)}</span><strong>${A.name}</strong>${isAdmin() ? `<span class="muted">${s.name}</span>` : ''}</div>`;
    }
    return `<div class="mk-big" style="cursor:default"><span class="mk-ico">${ic(A.icon, 28)}</span><strong>${A.name}</strong><div class="mk-pills">${g.list.map(instPill).join('')}</div></div>`;
  }).join('');
  const servers = isAdmin() ? `<div class="mk-servers">${SERVERS.map((s) => `<button class="mk-srv" data-settings="${s.id}" title="Réglages de ${s.name}"><span class="nav-dot ${!s.up ? 'bad' : s.alerts ? 'warn' : 'ok'}"></span><b>${s.name}</b><span>${s.id}</span>${!s.up ? '<span class="bad-t">injoignable</span>' : s.alerts ? `<span class="warn-t">${s.alerts} alerte</span>` : ''}</button>`).join('')}</div>` : '';
  return `<section class="mk-launch-page"><div class="mk-launch-head"><h1>Applis</h1></div><div class="mk-launch">${tiles}</div>${servers}</section>`;
}

  const top = `<nav class="topbar">${launchBtn(t.key)}${brand(A.name)}<div class="tabs home-tabs">${A.tabs.map(([icon, l], n) => `<button class="${n === 0 ? 'on' : ''}">${ic(icon)} <span>${l}</span></button>`).join('')}</div>${right({ gear: i.sv })}</nav>`;
  const body = `<section class="library mk-appbody"><div class="library-inner wide">${head(A.tabs[0][1], sv(i.sv).name, `<button class="btn primary">${ic('plus')} Nouveau</button>`)}
    <div class="project-grid">${pics.map((p, n) => `<article class="project-card"><div class="sc-thumb"><div class="sc-pic ${p}"></div></div><div class="project-body"><strong>${['Plateau 1', 'Duplex SRT', 'Régie 2', 'Antenne'][n]}</strong><span class="muted">${['SDI 1', 'SRT', 'ST 2110', 'UDP'][n]}</span></div><div class="mk-foot"><span class="nav-dot ok"></span>En marche</div></article>`).join('')}</div></div></section>`;
  return `<div class="app">${top}<div class="content">${body}</div></div>`;
}

// ------------------------------------------------------------------ rendu
function page(t) {
  if (t.kind === 'app') return appView(t);
  CTX = t.kind === 'settings' ? sv(t.sv) : MASTER;
  if (t.kind === 'cockpit' && t.view === 'home') return `<div class="app"><nav class="topbar">${launchBtn()}${brand('Core')}${right({ gear: MASTER.id })}</nav><div class="content">${cockpit()}</div></div>`;
  return `<div class="app"><nav class="topbar">${launchBtn()}${brand('Réglages')}<span class="mk-srv-badge">${ic('server', 12)} ${CTX.name} · ${CTX.id}</span>${right({ gear: 'on' })}</nav><div class="content">${settingsView(t)}</div></div>`;
}
function modal() {
  if (S.modal !== 'invite') return '';
  return `<div class="modal-back" data-close-modal><div class="modal"><header><h2>Ajouter un serveur</h2><button class="icon-btn ghost" data-close-modal title="Fermer">${ic('x', 16)}</button></header>
    <div class="mk-modal-body">${field('Adresse du maître', `<input value="${host(MASTER)}" readonly />`)}<div class="mk-code">K7Q-4XM-92P</div><span class="muted" style="text-align:center">Valable 10 min</span></div>
    <footer><button class="btn">${ic('rotate-ccw')} Nouveau code</button><button class="btn primary" data-close-modal>Fermer</button></footer></div></div>`;
}
function render() {
  const t = tab();
  const [h, path] = tabUrl(t);
  document.getElementById('root').innerHTML = `<div class="mk-browser"><div class="mk-tabs">${S.tabs.map((x) => `<div class="mk-btab ${x.id === S.active ? 'on' : ''}" data-tab-id="${x.id}"><span class="mk-fav">${ic(tabIcon(x), 11)}</span><span class="mk-btab-t">${tabTitle(x)}</span>${x.id === 'cockpit' ? '' : `<button class="mk-x" data-close-tab="${x.id}" title="Fermer l’onglet">${ic('x', 12)}</button>`}</div>`).join('')}</div>
    <div class="mk-url">${ic('lock', 12)}<span><b>${h}</b>${path === '/' ? '' : path}</span></div></div>
    <div class="mk-page">${page(t)}</div>${modal()}`;
  document.querySelectorAll('#mock [data-role]').forEach((b) => b.classList.toggle('on', b.dataset.role === S.role));
  try { localStorage.setItem('mkc.role', S.role); } catch { /* */ }
}
const theme = () => (document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
function setTheme(t) { if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; }

document.addEventListener('click', (e) => {
  const q = (sel) => e.target.closest(sel);
  let el;
  if ((el = q('[data-role]'))) { Object.assign(S, { role: el.dataset.role }, fresh()); return render(); }
  if (q('[data-reset]')) { Object.assign(S, fresh()); return render(); }
  if (q('[data-mtheme]')) { setTheme(theme() === 'light' ? 'dark' : 'light'); return render(); }
  if ((el = q('[data-theme-set]'))) { setTheme(el.dataset.themeSet); return render(); }
  if ((el = q('[data-close-tab]'))) { const id = el.dataset.closeTab; const n = S.tabs.findIndex((t) => t.id === id); S.tabs.splice(n, 1); if (S.active === id) S.active = S.tabs[Math.max(0, n - 1)].id; return render(); }
  if ((el = q('[data-close-modal]')) && (el.dataset.closeModal !== undefined) && (e.target === el || q('button[data-close-modal]'))) { S.modal = null; return render(); }
  if ((el = q('[data-modal]'))) { S.modal = el.dataset.modal; return render(); }
  if ((el = q('[data-menu]'))) { S.menu = S.menu === el.dataset.menu ? null : el.dataset.menu; return render(); }
  if ((el = q('[data-inst]'))) { openApp(el.dataset.inst); return render(); }
  if (q('[data-home]')) { S.tabs[0].view = 'home'; activate('cockpit'); return render(); }
  if ((el = q('[data-settings]'))) { if (el.dataset.settings) openSettings(el.dataset.settings); return render(); }
  if ((el = q('[data-tab-id]'))) { activate(el.dataset.tabId); return render(); }
  if ((el = q('[data-page]'))) { tab().page = el.dataset.page; return render(); }
  if ((el = q('.segmented button'))) { el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el)); return; }
  if (S.menu && !q('.menu')) { S.menu = null; render(); }
});
try { const r = localStorage.getItem('mkc.role'); if (r === 'admin' || r === 'user') S.role = r; } catch { /* */ }
if (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: light)').matches) setTheme('light');
if (document.documentElement.dataset.theme === 'dark') delete document.documentElement.dataset.theme;
render();
</script>
</body>
</html>
